[package]
name = "localsend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bytes = "1.11"
ed25519-dalek = { version = "2.2", features = ["pem", "rand_core"], optional = true }
futures-util = { version = "0.3.31", features = ["sink"] }
http-body-util = { version = "0.1.3", optional = true }
hyper = { version = "1.8.1", optional = true }
hyper-util = { version = "0.1.19", features = ["server"], optional = true }
iroh = { version = "1.0.0-rc.1", optional = true }
iroh-blobs = { version = "0.102", optional = true }
lru = "0.16.3"
pem = { version = "3.0.6", optional = true }
reqwest = { version = "0.13.4", features = ["charset", "http2", "system-proxy", "json", "rustls-no-provider", "stream"], default-features = false, optional = true }
rand = "0.9.1"
rsa = { version = "0.9.8", optional = true }
rustls = { version = "0.23.33", default-features = false, features = ["ring", "tls12", "std"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10.9", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"], optional = true }
tokio-stream = "0.1.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20" }
uuid = { version = "1.20.0", features = ["serde", "v4"] }
x509-parser = { version = "0.18.0", features = ["verify"], optional = true }

[features]
default = []
crypto = ["ed25519-dalek", "rsa", "sha2"]
http = ["crypto", "http-body-util", "hyper", "hyper-util", "pem", "reqwest", "rustls", "tokio-rustls", "x509-parser"]
iroh-transport = ["dep:iroh", "iroh-blobs"]
full = ["crypto", "http", "iroh-transport"]
